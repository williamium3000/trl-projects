# AMC 2023 — 83 problems from the AMC 10/12 2023 sets curated by AI-MO.
# Source: AI-MO/aimo-validation-amc (train split)
# Answers are numeric / simple symbolic; we compare with math_verify.
task: amc23
dataset_path: AI-MO/aimo-validation-amc
dataset_name: null
test_split: train
training_split: null
fewshot_split: null
output_type: generate_until
doc_to_text: "Problem: {{problem}}\nPlease reason step by step, and put your final answer within \\boxed{}."
doc_to_target: "{{answer}}"
process_results: !function utils.process_results_amc
generation_kwargs:
  max_gen_toks: 4096
  do_sample: false
  temperature: 0.0
  until: []
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
metadata:
  version: 1.0
